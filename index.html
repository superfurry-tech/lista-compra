<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de la Compra</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="lista-de-verificacion.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- PANTALLA 0: INTRODUCIR PIN DE LA FAMILIA -->
    <div id="pantallaPin" style="text-align: center; margin-top: 50px;">
        <h2>🔒 Acceso a Lista de la Compra</h2>
        <p>Introduce el PIN de tu hogar:</p>
        <div style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px;">
            <input type="password" id="inputPin" placeholder="Ej: 1234" maxlength="10"
                style="padding: 10px; font-size: 1.2em; text-align: center; width: 150px; border-radius: 8px; border: 1px solid #ccc;">
            <button type="button" onclick="toggleMostrarPin()"
                style="padding: 8px 12px; font-size: 1.2em; background-color: #f0f0f0; border: 1px solid #ccc; border-radius: 8px; cursor: pointer;"
                title="Mostrar/Ocultar PIN">👁️</button>
        </div>
        <button onclick="validarPin()"
            style="padding: 10px 20px; font-size: 1em; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer;">
            Entrar
        </button>
        <p id="errorPin" style="color: red; margin-top: 15px; display: none;"></p>

        <!-- ENLACE PARA CREAR NUEVO HOGAR -->
        <p style="margin-top: 25px; font-size: 0.9em; color: #555;">
            ¿Es tu primera vez? <a href="#" onclick="mostrarPantallaRegistro()"
                style="color: #007bff; text-decoration: underline;">Crear nuevo hogar</a>
        </p>
    </div>

    <!-- PANTALLA REGISTRO: CREAR NUEVA FAMILIA -->
    <div id="pantallaRegistro" style="display: none; text-align: center; margin: 20px auto;">

        <h2>🏠 Crear Nuevo Hogar</h2>
        <p style="margin-bottom: 20px;">Nombre de familia y PIN:</p>

        <!-- Bloque centrado con ancho fijo de 230px -->
        <div style="display: inline-block; width: 230px; margin-bottom: 20px;">

            <!-- Fila 1: Nombre de familia -->
            <div style="margin-bottom: 12px;">
                <input type="text" id="nuevoNombreFamilia" placeholder="Ej: Casa García"
                    style="width: 100%; box-sizing: border-box; padding: 8px;">
            </div>

            <!-- Fila 2: PIN + botón para mostrarlo -->
            <div style="display: flex; gap: 8px;">
                <input type="password" id="nuevoPinFamilia" placeholder="PIN de 4 dígitos"
                    style="flex: 1; min-width: 0; padding: 8px;">
                <button type="button" onclick="toggleMostrarNuevoPin()" style="padding: 8px;">👁️</button>
            </div>

        </div>


        <button onclick="registrarFamilia()" style="padding: 10px 20px; font-size: 16px;">
            Crear y Entrar
        </button>


        <br><br>


        <a href="#" onclick="cancelarRegistro(); return false;" style="color: #666; font-size: 14px;">Cancelar</a>

        <p id="errorRegistro" style="color: red; margin-top: 15px; display: none;"></p>

    </div>


    <!-- PANTALLA 1: INGRESAR NOMBRE DE USUARIO -->
    <div id="pantallaUsuario" style="display: none; text-align: center; margin-top: 50px;">
        <h2>👤 ¿Quién eres?</h2>
        <p>Escribe tu nombre para saber quién añade o compra los productos:</p>
        <div style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px;"> <input
                type="text" id="inputNombreUsuario" placeholder="Ej: María, Juan, Papá..."
                style="padding: 10px; font-size: 1.1em; text-align: center; width: 220px; border-radius: 8px; border: 1px solid #ccc;"
                onkeypress="if(event.key==='Enter') guardarNombreUsuario()">
        </div>
        <button onclick="guardarNombreUsuario()"
            style="padding: 10px 20px; font-size: 1em; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            Entrar a la Lista
        </button>
    </div>

    <!-- PANTALLA 2: PANEL PRINCIPAL -->
    <div id="panelPrincipal" style="display: none;">
        <h1 id="textoSaludo" style="text-align: left; font-size: 1.3em; margin-bottom: 20px;">🛒 Lista de la Compra</h1>

        <div class="input-group">
            <input type="text" id="nuevoProducto" placeholder="Añadir producto..."
                onkeypress="if(event.key==='Enter') agregarProducto()">
            <button class="btn-principal" onclick="agregarProducto()">Añadir</button>
        </div>

        <ul id="lista"></ul>
    </div>

    <script src="app.js"></script>

</body>

</html>
